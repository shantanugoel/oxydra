[workspace]
resolver = "2"
members = [
  "crates/types",
  "crates/provider",
  "crates/tools",
  "crates/tools-macros",
  "crates/runtime",
  "crates/memory",
  "crates/runner",
  "crates/oxydra-shelld",
  "crates/channels",
  "crates/gateway",
  "crates/tui",
  "crates/wasm-guest",
]

[workspace.dependencies]
rust-bash = { git = "https://github.com/shantanugoel/rust-bash.git", rev = "7758919dd877198a72b06b043e8d3da39a5b518a", default-features = false, features = ["native-fs", "network"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
debug = false
strip = true
